name: Extract AffiFlow Phase 2 Bundle

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/extract-affiflow-phase2.yml'
      - 'affiflow-assisted-phase2/AffiFlow-Assisted-Media-Phase2.base64.txt'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode and extract bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf affiflow-assisted-phase2/extracted
          mkdir -p affiflow-assisted-phase2/extracted
          base64 --decode affiflow-assisted-phase2/AffiFlow-Assisted-Media-Phase2.base64.txt > /tmp/affiflow-phase2.zip
          unzip -o /tmp/affiflow-phase2.zip -d affiflow-assisted-phase2/extracted

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add affiflow-assisted-phase2/extracted
          if git diff --cached --quiet; then
            echo "No extracted changes"
            exit 0
          fi
          git commit -m "Extract AffiFlow Phase 2 bundle"
          git push
